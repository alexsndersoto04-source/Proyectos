name: Build Void Runner APK
on:
  push:
    branches: [ main, arena/* ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Download Godot 4.2.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64
      - name: Install Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          unzip -q Godot_v4.2.1-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.2.1.stable/
      - name: Prepare
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          echo -e "[gd_resource type=\"EditorSettings\" format=3]\n[resource]\nexport/android/debug_keystore=\"${{ github.workspace }}/debug.keystore\"\nexport/android/debug_keystore_user=\"androiddebugkey\"\nexport/android/debug_keystore_pass=\"android\"" > ~/.config/godot/editor_settings-4.tres
          mkdir -p build/android
      - name: Build APK Direct
        run: |
          timeout 120 ./Godot_v4.2.1-stable_linux.x86_64 --headless --export-debug "Android" build/android/VoidRunner.apk || true
          ls -lh build/android/
          if [ ! -f build/android/VoidRunner.apk ]; then
            timeout 120 ./Godot_v4.2.1-stable_linux.x86_64 --headless --export-release "Android" build/android/VoidRunner.apk || true
            ls -lh build/android/
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-APK
          path: build/android/
