name: Build Void Runner APK

on:
  push:
    branches: [ main, arena/* ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Godot
        run: |
          wget https://downloads.github.com/godotengine/godot/4.2.1/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64
          
      - name: Install Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          wget https://downloads.github.com/godotengine/godot/4.2.1/Godot_v4.2.1-stable_export_templates.tpz
          unzip Godot_v4.2.1-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.2.1.stable
          
      - name: Setup Android
        uses: android-actions/setup-android@v3
        
      - name: Build APK
        run: |
          mkdir -p build/android
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --export-release "Android" build/android/VoidRunner.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-Android
          path: build/android/*.apk
