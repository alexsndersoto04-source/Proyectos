<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#bg)"/>
  
  <!-- Outer glow -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.5"/>
  
  <!-- Inner design - Void Runner symbol -->
  <g transform="translate(64,64)">
    <!-- Diamond shape -->
    <path d="M0,-35 L25,0 L0,35 L-25,0 Z" fill="none" stroke="url(#neon)" stroke-width="3"/>
    
    <!-- Inner diamond -->
    <path d="M0,-20 L15,0 L0,20 L-15,0 Z" fill="url(#neon)" opacity="0.6"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="5" fill="#00ffff"/>
    
    <!-- Accent lines -->
    <line x1="-40" y1="0" x2="-25" y2="0" stroke="#00ffff" stroke-width="2"/>
    <line x1="25" y1="0" x2="40" y2="0" stroke="#00ffff" stroke-width="2"/>
    <line x1="0" y1="-40" x2="0" y2="-25" stroke="#ff00ff" stroke-width="2"/>
    <line x1="0" y1="25" x2="0" y2="40" stroke="#ff00ff" stroke-width="2"/>
  </g>
  
  <!-- Corner accents -->
  <circle cx="16" cy="16" r="4" fill="#00ffff" opacity="0.8"/>
  <circle cx="112" cy="16" r="4" fill="#ff00ff" opacity="0.8"/>
  <circle cx="16" cy="112" r="4" fill="#ff00ff" opacity="0.8"/>
  <circle cx="112" cy="112" r="4" fill="#00ffff" opacity="0.8"/>
</svg>
