<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Void Runner - Jugable</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:white;font-family:system-ui, -apple-system, sans-serif; overflow:hidden; touch-action:manipulation}
#game{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center, #1a1a3a 0%, #0a0a1a 80%)}
canvas{background:#0f0f20;border:2px solid #5346a0;border-radius:12px; box-shadow:0 0 40px #6a5acd44; max-width:95vw; max-height:70vh}
#ui{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.score{font-size:28px;font-weight:800;text-shadow:0 2px 10px #6a5acd}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:20}
#center h1{font-size:48px; letter-spacing:2px; text-shadow:0 0 20px #6a5acd; margin-bottom:10px}
#center p{font-size:18px;opacity:0.8}
.btn{margin-top:20px;padding:14px 28px;background:#6a5acd;color:white;border:none;border-radius:10px;font-size:20px;font-weight:700;cursor:pointer;pointer-events:auto;box-shadow:0 4px 20px #6a5acd88;transition:0.2s}
.btn:hover{transform:scale(1.05);background:#7a6add}
#controls{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);opacity:0.5;font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="game">
<div id="ui"><div class="score" id="score">Score: 0</div><div class="score" id="best">Best: 0</div></div>
<canvas id="c" width="900" height="500"></canvas>
<div id="center">
<h1 id="title">VOID RUNNER</h1>
<p id="sub">TAP o SPACE para saltar<br>Doble salto activado</p>
<button class="btn" id="startBtn">JUGAR ▶</button>
</div>
<div id="controls">SPACE / TAP = Saltar - Sobrevive al void!</div>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
const center=document.getElementById('center'), title=document.getElementById('title'), sub=document.getElementById('sub'), btn=document.getElementById('startBtn');

let best=parseInt(localStorage.getItem('void_best')||'0');
bestEl.textContent='Best: '+best;

let player={x:150,y:400,w:34,h:44,vy:0,jumps:2,onGround:false,dead:false,anim:0};
let obstacles=[], stars=[], score=0, speed=4, gameOver=false, playing=false, time=0;
let keys={};

function reset(){
 obstacles=[]; score=0; speed=4; gameOver=false; player.y=400; player.vy=0; player.jumps=2; player.dead=false; player.anim=0; time=0;
}

function spawnObstacle(){
 const types=['spike','block','orb'];
 const t=types[Math.floor(Math.random()*3)];
 let o={x:canvas.width+50,y:0,w:30,h:40,type:t, passed:false, float:Math.random()*6};
 if(t==='spike'){o.y=460;o.w=28;o.h=38;}
 else if(t==='block'){o.y=452;o.w=38;o.h=48;}
 else {o.y=320+Math.random()*120;o.w=34;o.h=34;}
 obstacles.push(o);
}

let spawnTimer=0;
function update(dt){
 if(!playing) return;
 time+=dt;
 spawnTimer+=dt;
 if(spawnTimer> (1.2 - Math.min(0.7, speed*0.04)) + Math.random()*0.6){
   spawnObstacle(); spawnTimer=0;
 }
 score+= dt*12 * (speed/4);
 speed+= dt*0.08;
 // player physics
 player.vy+= 0.9;
 player.y+= player.vy;
 if(player.y>400){player.y=400; player.vy=0; player.onGround=true; player.jumps=2;} else player.onGround=false;

 // obstacles
 for(let o of obstacles){
  o.x-=speed;
  o.float+=0.08;
  if(o.type==='orb') o.y+= Math.sin(o.float)*0.8;
  // collision
  if(!player.dead && player.x+player.w*0.6 > o.x && player.x < o.x+o.w && player.y+player.h > o.y && player.y < o.y+o.h){
    die();
  }
  if(!o.passed && o.x+o.w < player.x){ o.passed=true; score+=25; }
 }
 obstacles=obstacles.filter(o=>o.x>-100);
 player.anim+=0.15;
 scoreEl.textContent='Score: '+Math.floor(score);
}

function die(){
 player.dead=true; gameOver=true; playing=false;
 if(Math.floor(score)>best){best=Math.floor(score); localStorage.setItem('void_best',best); bestEl.textContent='Best: '+best;}
 title.textContent='VOID CONSUMED';
 sub.innerHTML=`Score: ${Math.floor(score)}<br>Best: ${best}`;
 btn.textContent='REINTENTAR ↻';
 center.style.display='block';
 canvas.style.filter='grayscale(0.6) blur(2px)';
}

function draw(){
 // bg
 ctx.fillStyle='#0f0f20'; ctx.fillRect(0,0,canvas.width,canvas.height);
 // stars parallax
 ctx.fillStyle='rgba(255,255,255,0.6)';
 for(let i=0;i<80;i++){
  let x=(i*137.5 + time* (10 + i%3*8))% (canvas.width+100) -50;
  let y=(i*73)%400;
  let s=1+ (i%3);
  ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.fill();
  if(i%7===0){ctx.fillStyle='rgba(150,140,255,0.8)'; ctx.beginPath(); ctx.arc(x,y,s*0.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,255,255,0.6)';}
 }
 // floor glow
 ctx.fillStyle='#3a347a44'; ctx.fillRect(0,448,canvas.width,6);
 ctx.fillStyle='#6a5acd'; ctx.fillRect(0,454,canvas.width,3);
 ctx.fillStyle='#1e1e3a'; ctx.fillRect(0,457,canvas.width,100);

 // obstacles
 for(let o of obstacles){
  ctx.save();
  ctx.translate(o.x+o.w/2,o.y+o.h/2);
  if(o.type==='spike'){
   ctx.fillStyle='#ff445a'; ctx.beginPath(); ctx.moveTo(0,-19); ctx.lineTo(-14,19); ctx.lineTo(14,19); ctx.closePath(); ctx.fill();
   ctx.strokeStyle='#ff8a9a'; ctx.lineWidth=2; ctx.stroke();
   ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(-16,22,32,4);
  } else if(o.type==='block'){
   ctx.fillStyle='#4a8cff'; ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);
   ctx.strokeStyle='#8ac4ff'; ctx.lineWidth=2; ctx.strokeRect(-o.w/2,-o.h/2,o.w,o.h);
   ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(-20,26,40,4);
  } else {
   ctx.fillStyle='#8a5aff'; ctx.beginPath(); ctx.arc(0,0,17,0,Math.PI*2); ctx.fill();
   ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(-5,-5,4,0,Math.PI*2); ctx.fill();
   ctx.strokeStyle='#c4a0ff'; ctx.lineWidth=2; ctx.stroke();
   ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(-18,28,36,4);
  }
  ctx.restore();
 }

 // player
 ctx.save();
 ctx.translate(player.x+player.w/2, player.y+player.h/2);
 if(player.dead){ ctx.rotate(0.3); }
 let leg=Math.sin(player.anim)*6;
 // shadow
 ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(-18, player.h/2-2, 36,4);
 if(player.dead){
  ctx.fillStyle='#ff5555'; ctx.fillRect(-16,-12,32,24);
  ctx.fillStyle='white'; ctx.font='16px sans-serif'; ctx.fillText('X X', -12, -2);
 } else {
  ctx.fillStyle='#e8e8ff';
  ctx.fillRect(-16,-22,32,36);
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(4,-18,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2a2a4a'; ctx.beginPath(); ctx.arc(8,-19,3,0,Math.PI*2); ctx.fill();
  if(player.onGround){
   ctx.fillStyle='#a0a0d0'; ctx.fillRect(-12+leg,12,10,16); ctx.fillRect(2-leg,12,10,16);
  } else {
   ctx.fillStyle='#a0a0d0'; ctx.fillRect(-8,10,20,10);
  }
  if(!player.onGround && player.jumps===0){
   ctx.strokeStyle='#8a5aff44'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,26,0,Math.PI*2); ctx.stroke();
  }
 }
 ctx.restore();
}

let last=0;
function loop(t){
 requestAnimationFrame(loop);
 let dt=Math.min(0.05,(t-last)/1000); last=t;
 if(isNaN(dt)) dt=0.016;
 update(dt);
 draw();
}
loop(0);

function jump(){
 if(!playing && !gameOver){ start(); }
 if(gameOver) return;
 if(player.dead) return;
 if(player.onGround || player.jumps>0){
  player.vy=-14;
  if(!player.onGround) player.jumps--;
  else player.jumps=1;
  player.onGround=false;
  // small haptic
  if(navigator.vibrate) navigator.vibrate(20);
 }
}

function start(){
 reset();
 playing=true; gameOver=false;
 center.style.display='none';
 canvas.style.filter='none';
}

btn.addEventListener('click',()=>{ if(gameOver||!playing) start(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); jump(); }});
canvas.addEventListener('pointerdown',jump);
document.addEventListener('touchstart',e=>{ e.preventDefault(); jump(); },{passive:false});
</script>
</body>
</html>
