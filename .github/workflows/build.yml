name: Build Void Runner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -o Godot_v4.2.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.1-stable_linux.x86_64

      - name: Install Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -o Godot_v4.2.1-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/4.2.1.stable

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Pre-import assets (genera el caché .godot)
        run: |
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE" \
            --editor --quit --verbose > import.log 2>&1
          echo "Exit code del import: $?"
          tail -30 import.log

      - name: Build APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build/android
          ./Godot_v4.2.1-stable_linux.x86_64 --headless --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-release "Android" \
            "build/android/VoidRunner.apk" > export.log 2>&1
          echo "Exit code del export: $?"
          echo "--- Salida del export ---"
          cat export.log
          ls -la build/android/ || true

      - name: Verificar APK
        run: |
          if [ -f "build/android/VoidRunner.apk" ]; then
            echo "✅ APK generado correctamente"
            ls -lh build/android/VoidRunner.apk
          else
            echo "❌ ERROR: no se generó el APK"
            tail -80 export.log 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-Android
          path: build/android/*.apk
          if-no-files-found: error
