name: Build Void Runner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar entorno Godot y Diagnosticar
        run: |
          mkdir -p ~/.config/godot
          mkdir -p build/android

          # Configurar settings de Godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Instalar plantillas de compilacion de Android si no existen
          if [ ! -d "android/build" ]; then
            echo "Instalando build template de Android..."
            mkdir -p android/build
            unzip -o /root/.local/share/godot/export_templates/4.2.1.stable/android_source.zip -d android/build > /dev/null 2>&1
          fi

          echo "=== IMPORTANDO ASSETS ==="
          godot --headless --editor --quit || true

          echo "=== INTENTANDO EXPORTAR APK ==="
          godot --headless --verbose --export-debug "Android" build/android/VoidRunner.apk

          echo "=== CONTENIDO DE LA CARPETA BUILD ==="
          ls -la build/android/

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-APK
          path: build/android/*.apk
          if-no-files-found: error
