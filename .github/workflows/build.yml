name: Build Void Runner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  EXPORT_NAME: VoidRunner
  HOME: /root

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configurar editor settings de Godot 4.2
        run: |
          # Godot 4.2.1 lee editor_settings-4.tres (versión MAYOR)
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          EOF
          echo "=== Verificaciones ==="
          ls -la /root/debug.keystore && echo "OK keystore"
          ls /usr/lib/android-sdk/platform-tools/adb >/dev/null 2>&1 && echo "OK sdk"
          ls /root/.local/share/godot/export_templates/4.2.1.stable/android_debug.apk && echo "OK templates"

      - name: Build APK
        run: |
          export HOME=/root
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" \
            "build/android/${EXPORT_NAME}.apk" 2>&1 | tail -40
          echo "--- Archivos generados: ---"
          ls -la build/android/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-Android
          path: build/android/*.apk
          if-no-files-found: error
