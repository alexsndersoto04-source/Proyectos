name: Build Void Runner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Descargar Godot 4.2.1 y Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          unzip -q Godot_v4.2.1-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.2.1.stable
          mv ~/.local/share/godot/export_templates/4.2.1.stable/templates/* ~/.local/share/godot/export_templates/4.2.1.stable/

      - name: Crear Keystore de prueba
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Configurar Godot y Exportar APK
        run: |
          mkdir -p ~/.config/godot
          mkdir -p build/android

          # Configurar rutas absolutas
          cat << EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Extraer plantilla fuente de Android si no existe
          if [ ! -d "android/build" ]; then
            mkdir -p android/build
            unzip -q ~/.local/share/godot/export_templates/4.2.1.stable/android_source.zip -d android/build
          fi

          echo "=== IMPORTANDO RECURSOS ==="
          godot --headless --editor --quit || true

          echo "=== INICIANDO EXPORTACION ==="
          godot --headless --verbose --export-debug "Android" build/android/VoidRunner.apk 2>&1 | tee godot_export.log

          echo "=== ARCHIVOS RESULTANTES ==="
          find . -name "*.apk"

      - name: Subir Log en caso de fallo
        if: failure() || always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-export-log
          path: godot_export.log

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-APK
          path: "**/*.apk"
          if-no-files-found: error
