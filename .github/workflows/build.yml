name: Build Void Runner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  EXPORT_NAME: VoidRunner
  ANDROID_HOME: /usr/lib/android-sdk
  GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
  GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /root/debug.keystore
  GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4

      - name: Preparar entorno Godot
        run: |
          set -x
          # Godot busca las templates en $HOME/.local/share/godot/export_templates.
          # GitHub Actions cambia $HOME, así que copiamos desde la ubicación del contenedor.
          mkdir -p "$HOME/.local/share/godot/export_templates/4.2.1.stable"
          cp /root/.local/share/godot/export_templates/4.2.1.stable/android_* \
             "$HOME/.local/share/godot/export_templates/4.2.1.stable/" 2>/dev/null || echo "copiando templates... continuamos"
          # Copiamos la keystore de depuración a $HOME por si acaso
          cp /root/debug.keystore "$HOME/debug.keystore" 2>/dev/null || true
          echo "=== HOME=$HOME ==="
          echo "=== Templates android: ==="
          ls "$HOME/.local/share/godot/export_templates/4.2.1.stable/" | grep -i android
          echo "=== Keystore: ==="
          ls -la "$HOME/debug.keystore"
          echo "=== SDK: ==="
          ls /usr/lib/android-sdk/platform-tools/adb && echo "OK adb"
          echo "=== godot version: ==="
          godot --version

      - name: Importar assets
        run: |
          export HOME=${HOME}
          godot --headless --path "$GITHUB_WORKSPACE" --editor --quit >/dev/null 2>&1 || true
          echo "Import terminado"

      - name: Compilar APK
        run: |
          export HOME=${HOME}
          mkdir -p build/android
          # Godot usa las variables GODOT_ANDROID_KEYSTORE_* para firmar
          godot --headless --verbose --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/android/${EXPORT_NAME}.apk" 2>&1 | tail -60
          echo "=== Buscando APK ==="
          find "$GITHUB_WORKSPACE" -name "*.apk" 2>/dev/null
          ls -la build/android/ || true
          # Falla si no se generó
          test -f "build/android/${EXPORT_NAME}.apk" || { echo "::error::APK NO generado"; exit 1; }

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-Android
          path: build/android/*.apk
          if-no-files-found: error
