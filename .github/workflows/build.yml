name: Build Void Runner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Descargar Godot 4.2.1 y Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.2.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.2.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          wget -q https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          unzip -q Godot_v4.2.1-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.2.1.stable
          mv ~/.local/share/godot/export_templates/4.2.1.stable/templates/* ~/.local/share/godot/export_templates/4.2.1.stable/

      - name: Crear Keystore de Android
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configurar Godot y Exportar APK
        run: |
          mkdir -p ~/.config/godot
          mkdir -p build/android

          # Inyectar variables dinámicas del entorno de GitHub
          cat << EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Extraer plantillas de gradle si no existen
          if [ ! -d "android/build" ]; then
            mkdir -p android/build
            unzip -q ~/.local/share/godot/export_templates/4.2.1.stable/android_source.zip -d android/build
          fi

          echo "=== IMPORTANDO ASSETS ==="
          godot --headless --editor --quit || true

          echo "=== COMPILANDO APK ==="
          godot --headless --verbose --export-debug "Android" build/android/VoidRunner.apk

          # Validar que el APK realmente existe antes de avanzar
          if [ ! -f "build/android/VoidRunner.apk" ]; then
            echo "ERROR CRÍTICO: El archivo APK no fue generado por Godot."
            exit 1
          fi

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-APK
          path: build/android/VoidRunner.apk
          if-no-files-found: error
