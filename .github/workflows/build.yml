name: Build Void Runner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  EXPORT_NAME: VoidRunner

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" "build/android/${EXPORT_NAME}.apk"
          ls -la build/android/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-Android
          path: build/android/*.apk
          if-no-files-found: error
