name: Build Void Runner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  EXPORT_NAME: VoidRunner

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Corregir editor settings (Godot 4.2 usa editor_settings-4.tres)
        run: |
          export HOME=/root
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          EOF
          ls -la /root/debug.keystore && echo "KEYSTORE OK"
          ls /usr/lib/android-sdk >/dev/null 2>&1 && echo "SDK OK"
          ls /root/.local/share/godot/export_templates/4.2.1.stable/ | grep -i android && echo "TEMPLATES OK"

      - name: Import assets
        run: |
          export HOME=/root
          godot --headless --path "$GITHUB_WORKSPACE" --editor --quit --import > import.log 2>&1 || true
          tail -5 import.log

      - name: Build APK
        run: |
          export HOME=/root
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" \
            "build/android/${EXPORT_NAME}.apk" > export.log 2>&1
          echo "exit=$?"
          ls -la build/android/
          if [ ! -f "build/android/${EXPORT_NAME}.apk" ]; then
            echo "::error::APK no generado. Últimas líneas del log:"
            tail -30 export.log | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-Android
          path: build/android/*.apk
          if-no-files-found: error
